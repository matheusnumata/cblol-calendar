name: Atualizar Calendario CBLOL

on:
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite que você rode o script manualmente pelo site do GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Dá permissão para o bot salvar o arquivo .ics de volta no repositório

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python no servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar as bibliotecas (dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o script gerador
      run: python cblol.py

    - name: Salvar e dar Push no arquivo .ics atualizado
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add cblol_2026.ics
        
        # Só faz o commit se houver alguma alteração real nos jogos
        git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática do calendário" && git push)